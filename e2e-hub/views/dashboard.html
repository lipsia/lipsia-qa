<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · E2E Hub</title>
  <script>
    // Apply the stored theme before first paint so navigation doesn't flash the other theme.
    try {
      const t = localStorage.getItem('e2e-hub-theme');
      if (t) document.documentElement.dataset.theme = t;
      if ((t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark') document.documentElement.classList.add('is-dark');
    } catch { /* storage unavailable */ }
  </script>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Rubik:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
  <header class="app-header"><div class="app-header-inner"></div></header>
  <main class="page">
    <div class="page-head">
      <div>
        <h1>Dashboard</h1>
        <p>Run history and usage across all users.</p>
      </div>
      <div class="page-head-actions">
        <div class="segmented" id="tag-filter">
          <button type="button" data-tag="">All</button>
          <button type="button" data-tag="po">Product Owner</button>
          <button type="button" data-tag="dev">Developer</button>
          <button type="button" data-tag="untagged">Untagged</button>
        </div>
        <button class="btn btn-sm" id="refresh-btn" type="button">Refresh</button>
      </div>
    </div>

    <div class="kpis" id="kpis"></div>

    <div class="dash-grid">
      <section class="card">
        <div class="card-head">
          <h2>Runs per day</h2>
          <div class="segmented" id="days-filter">
            <button type="button" data-days="14">14 days</button>
            <button type="button" data-days="30">30 days</button>
            <button type="button" data-days="90">90 days</button>
          </div>
        </div>
        <div class="card-body">
          <div class="chart-legend"><span><i class="swatch passed"></i>Passed</span><span><i class="swatch failed"></i>Failed</span></div>
          <div id="timeseries" class="chart"></div>
        </div>
      </section>

      <section class="card">
        <div class="card-head"><h2>Runs per user</h2></div>
        <div class="card-body" id="per-user"></div>
      </section>
    </div>

    <section class="card">
      <div class="card-head">
        <h2>Recent runs</h2>
        <input class="input input-sm" id="user-search" placeholder="Filter by user…" style="max-width:220px">
      </div>
      <div class="card-body flush table-wrap">
        <table class="table">
          <thead>
            <tr><th>Time</th><th>User</th><th>Spec</th><th>Stage</th><th>Result</th><th class="num">Duration</th><th>Failure reason</th></tr>
          </thead>
          <tbody id="runs"></tbody>
        </table>
      </div>
    </section>
  </main>
  <div class="chart-tooltip" id="tooltip" hidden></div>
  <script src="/js/common.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>

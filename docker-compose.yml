services:
  control-center:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ${IMAGE:-lipsia-qa:latest}
    restart: unless-stopped
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      VNC_PUBLIC_BASE_URL: ${VNC_PUBLIC_BASE_URL:-}
      VNC_PUBLIC_PORT: ${VNC_PORT:-6080}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      MAX_CONCURRENT_RUNS_PER_USER: ${MAX_CONCURRENT_RUNS_PER_USER:-10}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${CONTROL_CENTER_PORT:-9877}:9877"
      - "${BIND_ADDRESS:-127.0.0.1}:${VNC_PORT:-6080}:6080"
    shm_size: 2gb
    volumes:
      - ./cypress.env.json:/app/cypress.env.json:ro
      # Specs and the step catalog are mounted so new tests show up without a rebuild.
      - ./cypress:/app/cypress
      - ./test-reports:/app/test-reports
      - control-center-data:/app/data

volumes:
  control-center-data:

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

; Virtual display :99 for headless runs. Live View runs get their own display from the
; E2E Hub's display pool (e2e-hub/lib/displayPool.js).
[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 %(ENV_SCREEN_GEOMETRY)s -ac +extension RANDR
autorestart=true
priority=10
stdout_logfile=/var/log/xvfb.log
stderr_logfile=/var/log/xvfb.err

; Waits for the X socket — fluxbox exits immediately if the display is not up yet.
[program:fluxbox]
command=/bin/sh -c 'i=0; while [ ! -e /tmp/.X11-unix/X99 ] && [ $i -lt 200 ]; do i=$((i+1)); sleep 0.05; done; exec /usr/bin/fluxbox'
autorestart=true
priority=15
environment=DISPLAY=":99",HOME="/root"
stdout_logfile=/var/log/fluxbox.log
stderr_logfile=/var/log/fluxbox.err

; Single websockify gateway for all Live View streams, routed by token.
[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc --token-plugin=TokenFile --token-source=/tmp/novnc-tokens 6080
autorestart=true
priority=30
stdout_logfile=/var/log/novnc.log
stderr_logfile=/var/log/novnc.err

[program:e2e-hub]
command=node e2e-hub/server.js
directory=/app
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
